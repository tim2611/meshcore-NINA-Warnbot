[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meshcore-nina-warnbot"
version = "0.1.0"
description = "Leitet amtliche Warnungen aus der NINA-API des BBK in einen MeshCore-Kanal weiter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "meshcore>=2.3",
]
keywords = ["meshcore", "lora", "nina", "bbk", "warnung", "mesh"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Communications :: Ham Radio",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nina-warnbot = "nina_warnbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
