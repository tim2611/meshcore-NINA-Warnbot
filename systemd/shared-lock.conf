# Drop-in für den geteilten Betrieb mit lock_file in /tmp.
# Ablegen als /etc/systemd/system/nina-warnbot.service.d/shared-lock.conf
#
# PrivateTmp=yes gäbe dem Dienst ein eigenes /tmp, der Lock der anderen
# Programme wäre dann unsichtbar. Mit ProtectSystem=strict ist /tmp ohne
# ReadWritePaths schreibgeschützt; nötig, falls der Bot die Datei anlegt.
[Service]
PrivateTmp=no
ReadWritePaths=/tmp
